# bytestream-docs Nginx 反向代理模板
#
# 只做反代 + 静态资源缓存头，不直接 serve 任何文件——/api/search 依赖 Node 运行时，
# 必须始终经过 proxy_pass 转发给 app 容器，不能被这里的规则短路掉。
#
# 使用方法：
#   1. 把 server_name 换成实际域名，先只启用下面的 HTTP server block 跑起来；
#   2. 用 certbot 签发证书后（见 DEPLOY.md「HTTPS / 证书续期」一节），
#      取消注释文件末尾的 HTTPS server block，并把 HTTP block 里的 `location /`
#      改成到 HTTPS 的 301 跳转（模板里已给出对应注释，按需切换）。

upstream bytestream_app {
  server app:3000;
}

server {
  listen 80;
  listen [::]:80;
  server_name docs.bytestream.example.com;

  # Let's Encrypt HTTP-01 校验路径，certbot 续期时会用到，必须始终可被直接访问。
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # 证书签发完成、启用下方 HTTPS server block 后，把这里换成跳转：
  #   location / { return 301 https://$host$request_uri; }
  location / {
    proxy_pass http://bytestream_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Next.js 静态资源带内容 hash，可放心长缓存；请求本身仍转发给 Node 进程，
  # 只是叠加响应头，不做本地文件 serve。
  location /_next/static/ {
    proxy_pass http://bytestream_app;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}

