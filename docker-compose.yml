services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bytestream-docs:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    # 不直接对外映射端口；只允许同一 compose 网络内的 nginx 反代访问。

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt 证书与 HTTP-01 校验目录；首次启动会自动创建这两个宿主机目录。
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    # 默认不随 `docker compose up` 启动，仅在签发/续期证书时手动运行，见 DEPLOY.md。
    profiles: ["certbot"]
    entrypoint: >-
      sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
