services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bytestream-docs:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    # 方案 A：宿主机已有一套 nginx（宝塔，路径 /www/server/nginx，占用 80/443），
    # 不再起容器 nginx。只把 app 绑到本地回环由宿主机 nginx 反代；不对公网暴露端口。
    # 宿主机 3000 已被 multica-frontend 占用，这里改用 3200 避免冲突。
    ports:
      - "127.0.0.1:3200:3000"

# 说明：容器 nginx / certbot 已移除，交给宿主机宝塔面板做反向代理 + Let's Encrypt。
# 在宝塔「网站」里为 apidoc.uwid.top 建站，反向代理目标填 http://127.0.0.1:3200，
# 证书用宝塔一键 SSL 申请。deploy/nginx/app.conf 仅作为反代配置的参考模板保留。
